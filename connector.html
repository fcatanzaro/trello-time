<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Time Tracker – Connector</title>
</head>
<body>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script>
  /* ── helpers ─────────────────────────────────────────── */
  function formatTime(totalMinutes) {
    if (!totalMinutes) return null;
    var h = Math.floor(totalMinutes / 60);
    var m = totalMinutes % 60;
    if (h > 0 && m > 0) return h + 'h ' + m + 'm';
    if (h > 0) return h + 'h';
    return m + 'm';
  }

  /* Sum of all entries, falling back to the legacy single timeSpent value */
  function getTotalMinutes(t) {
    return t.get('card', 'shared').then(function(data) {
      data = data || {};
      if (Array.isArray(data.timeEntries)) {
        return data.timeEntries.reduce(function(sum, e) { return sum + e.m; }, 0);
      }
      return data.timeSpent || 0;
    });
  }

  function openTimePopup(t) {
    return t.popup({
      title: 'Log Time Spent',
      url:   './time-modal.html',
      height: 360
    });
  }

  /* ── Power-Up init ────────────────────────────────────── */
  TrelloPowerUp.initialize({

    /* Small badge shown on the card front */
    'card-badges': function(t) {
      return getTotalMinutes(t)
        .then(function(timeSpent) {
          if (!timeSpent) return [];
          return [{
            text: '⏱ ' + formatTime(timeSpent),
            color: 'blue'
          }];
        });
    },

    /* Larger badge shown on the card back */
    'card-detail-badges': function(t) {
      return getTotalMinutes(t)
        .then(function(timeSpent) {
          return [{
            title: 'Time Spent',
            text: timeSpent ? formatTime(timeSpent) : 'Not set',
            callback: openTimePopup
          }];
        });
    },

    /* Button in the card back sidebar */
    'card-buttons': function(t) {
      return [{
        text: 'Log Time',
        callback: openTimePopup
      }];
    }

  }, { appKey: '2c87f38b352e1bd4e33b9d124d51c9b3', appName: 'Trello Time' });
</script>
</body>
</html>
